<!DOCTYPE html>
<html lang="en" data-theme="imperial">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>afh21-21 • ⌬The_Flynner's⌬</title>
  <meta name="description" content="The Craftsmanship & The Ownership — Performance, Stability, Privacy.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://github.com/afh21-21.png">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Minimalist Top-Right Icon Controls -->
  <header class="top-controls" aria-label="Site Controls">
    <button id="btn-search" class="icon-btn bouncy" title="Quick Search (Ctrl+K)" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>

    <button id="btn-qr" class="icon-btn bouncy" title="Share QR Code" aria-label="QR Code">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zm4 4h3v3h-3zm-4 3h3"></path>
      </svg>
    </button>

    <!-- Theme Switcher Button -->
    <div class="popover-wrapper">
      <button id="btn-theme" class="icon-btn bouncy" title="Switch Design Theme" aria-label="Switch Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
      <div id="theme-popover" class="popover-menu hidden" role="menu">
        <button data-set-theme="imperial" class="popover-item active">Imperial Dark</button>
        <button data-set-theme="material" class="popover-item">Material You</button>
        <button data-set-theme="catppuccin" class="popover-item">Catppuccin Mocha</button>
        <button data-set-theme="apple" class="popover-item">Apple Elegant</button>
      </div>
    </div>

    <!-- Globe Language Switcher Button -->
    <div class="popover-wrapper">
      <button id="btn-lang" class="icon-btn bouncy" title="Change Language" aria-label="Change Language">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </button>
      <div id="lang-popover" class="popover-menu hidden" role="menu">
        <button data-set-lang="en-US" class="popover-item active">English (US)</button>
        <button data-set-lang="en-UK" class="popover-item">English (UK)</button>
        <button data-set-lang="id" class="popover-item">Indonesia</button>
        <button data-set-lang="ru" class="popover-item">Русский</button>
        <button data-set-lang="zh" class="popover-item">中文</button>
      </div>
    </div>
  </header>

  <!-- Main Responsive Split-Grid Container -->
  <main class="split-container">
    <!-- Left Column (Sticky on Desktop) -->
    <aside class="profile-column">
      <div class="profile-card">
        <div class="avatar-wrapper">
          <img id="profile-avatar" src="https://github.com/afh21-21.png" alt="afh21-21" class="avatar-img">
          <span id="status-badge" class="status-pill" title="Current Activity">
            <span id="status-emoji">⚡</span>
            <span id="status-text" class="skeleton-text">Loading...</span>
          </span>
        </div>

        <h1 id="profile-name" class="profile-title">afh21-21</h1>
        <p id="profile-alias" class="profile-subtitle">⌬The_Flynner's⌬</p>
        <p id="profile-bio" class="profile-bio skeleton-text">Loading profile...</p>

        <!-- Social Icons Row -->
        <nav id="social-row" class="social-row" aria-label="Social Links"></nav>
      </div>
    </aside>

    <!-- Right Column (Links & Live GitHub Widgets) -->
    <section class="content-column">
      <div class="section-header">
        <h2 id="section-links-title" class="section-title">Links & Channels</h2>
        <!-- Secret Admin Trigger (Double-Click or Ctrl+E) -->
        <button id="btn-edit-mode" class="edit-trigger" title="Toggle Edit Mode">✎</button>
      </div>

      <!-- Dynamic Link Cards Container (Starts with Skeleton Loaders) -->
      <div id="links-container" class="links-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

<!-- Live GitHub Profile Cards Embed (Auto Dark/Light Sync) -->
      <div class="github-embed-section">
        <h2 id="section-github-title" class="section-title">Live GitHub Overview</h2>
        <div id="github-cards-grid" class="github-cards-grid">
          <a href="https://github.com/afh21-21" target="_blank" rel="noopener noreferrer" class="github-card bouncy">
            <img id="gh-about-img" alt="About Me & My Enthusiast" loading="lazy">
          </a>
          <a href="https://github.com/afh21-21" target="_blank" rel="noopener noreferrer" class="github-card bouncy">
            <img id="gh-stack-img" alt="Tech Stack" loading="lazy">
          </a>
          <a href="https://github.com/afh21-21" target="_blank" rel="noopener noreferrer" class="github-card bouncy">
            <img id="gh-stats-img" alt="GitHub Activity" loading="lazy">
          </a>
        </div>
      </div>

  <!-- Linktree-Style Preview & Click-Guard Modal -->
  <div id="preview-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="modal-close" class="modal-close-btn bouncy" aria-label="Close">✕</button>
      <div class="modal-icon-box">
        <img id="modal-icon" src="" alt="" width="32" height="32">
      </div>
      <h3 id="modal-title" class="modal-title">Link Title</h3>
      <p id="modal-subtitle" class="modal-subtitle">Description</p>
      <div class="modal-url-box">
        <code id="modal-url">https://...</code>
      </div>
      <div class="modal-actions">
        <button id="modal-copy-btn" class="btn-secondary bouncy">Copy Link</button>
        <a id="modal-open-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary bouncy">
          <span class="btn-label">Continue to Link</span>
          <span class="btn-spinner hidden"></span>
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modular Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
